<section id="reservas" class="reservas secao">
  <div class="reservas__imagem revelar"><img src="assets/img/reserva.png" alt="Ambiente do restaurante" loading="lazy"></div>
  <div class="reservas__conteudo revelar">
    <p class="secao__selo">ご予約</p>
    <h2 class="secao__titulo">Reservas</h2>
    <p class="secao__descricao">Reserve uma mesa. Atendemos de terça a domingo, das 18h às 23h.</p>
    <form class="formulario-reserva" id="formulario-reserva">
      <div class="campo"><label for="reserva-nome">Nome</label><input type="text" id="reserva-nome" name="nome" placeholder="Seu nome" required></div>
      <div class="campo"><label for="reserva-email">E-mail</label><input type="email" id="reserva-email" name="email" placeholder="seu@email.com" required></div>
      <div class="campo"><label for="reserva-data">Data</label><input type="date" id="reserva-data" name="data" required></div>
      <div class="campo"><label for="reserva-horario">Horário</label><input type="time" id="reserva-horario" name="horario" required></div>
      <div class="campo campo--largo"><label for="reserva-pessoas">Pessoas</label><select id="reserva-pessoas" name="pessoas" required><option value="">Selecione</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7 ou mais">7 ou mais</option></select></div>
      <button type="submit" class="botao botao--primario campo--largo">Reservar</button>
      <p class="mensagem-formulario campo--largo" id="mensagem-reserva" aria-live="polite"></p>
    </form>
  </div>
</section>
